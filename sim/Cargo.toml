[package]
name = "sim"
version = "0.1.0"
edition = "2024"
authors = [ "Eliseo Cailloux", "Lukas Lein", "Sophie Menninger" ]

[lib]
crate-type = ["cdylib"]

[dependencies]
uwb = { path = "../uwb" }
driver = { path = "../driver" }

godot = "0.5.3"
regex = "1.12.4"
reqwest = { version = "0.13.4", features = ["blocking"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tiff = "0.11.3"

